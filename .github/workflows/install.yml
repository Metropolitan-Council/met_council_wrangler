name: Python package

on: 
    push:
        branches:
        - '*'
    pull_request:
        branches:
        - '*'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.7"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'setup-tests'
          path: 'met_council_wrangler'
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-variant: Mambaforge
          activate-environment: test-environment
          use-mamba: true
          python-version: ${{ matrix.python-version }}
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          mamba env update -n test-environment -f https://raw.githubusercontent.com/network-wrangler/cube_wrangler/main/conda-environments/environment.yml
      # install network wrangler from github repo
      - name: Install network wrangler
        run: |
          # clone the network wrangler repo
          git clone https://github.com/wsp-sag/network_wrangler.git
          cd network_wrangler
          git checkout develop_with_ranch
          
          pip install .
          cd ..
      - name: Install cube wrangler
        run: |
          git clone https://github.com/network-wrangler/cube_wrangler.git
          cd cube_wrangler
          pip install .
          cd ..
      - name: Install met council wrangler
        run: |
          cd met_council_wrangler
          pip install .
          cd ..
      - name: Verify network wrangler installation
        run: |
          python -c "import network_wrangler; print(network_wrangler.__version__)"
      - name: Lint with Black
        run: |
          # stop the build if there are problems
          black --check --diff --color --exclude "/.*network_wrangler.*/" --extend-exclude "/.*cube_wrangler.*/" .
      - name: Test met_council_wrangler.tests
        run: |
          cd met_council_wrangler/tests
          pytest .
